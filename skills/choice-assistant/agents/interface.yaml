interface:
  display_name: "English text"
  short_description: "English textEnglish text"
  default_prompt: "English text $choice-assistant English textEnglish textEnglish text"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source"
    generic: "neutral-source"
    agent-skills: "neutral-source"
    vscode: "canonical-source"
