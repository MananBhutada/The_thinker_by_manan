interface:
  display_name: "别纠结决策辅助"
  short_description: "把纠结拆成证据、风险和下一步的本地决策工具"
  default_prompt: "使用 $choice-assistant 把这个选择拆成可比较的理由、风险和一个可以先做的下一步，不替我做最终决定。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source"
    generic: "neutral-source"
    agent-skills: "neutral-source"
    vscode: "canonical-source"
